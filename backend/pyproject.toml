[project]
name = "atlas"
version = "0.1.0"
description = "Atlas — personal AI assistant platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "crewai",
    "langchain-openai",
    "langchain-mistralai",
    "pydantic",
    "pydantic-settings",
    "sqlmodel",
    "httpx",
    "requests",
    "trafilatura",
    "beautifulsoup4",
    "ddgs",
    "tavily-python",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "respx", "ruff"]

[tool.pytest.ini_options]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]